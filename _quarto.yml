project:
  type: book
  output-dir: docs
book:
  title: "Análise de sobrevivência aplicado a dados epidemiológicos"
  date: last-modified
  author: 
  - "Ana Caroline Alexandre Pantoja"
  - "Rodrigo Marreiros Tavares Graim"
  downloads: [pdf]
  chapters:
    - index.qmd
    - dist_exponencial.qmd
    - dist_weibull.qmd
    - dist_log_norm.qmd
    - dist_log_logis.qmd
    - fucoes_optim_IC.qmd
bibliography: references.bib
website:
  sidebar:
    id: "main-sidebar"
    style: "floating"    # Faz com que ela flutue sobre o conteúdo ao abrir
    collapse: true
format:
  html:
    theme:  
      light: flatly
      dark: darkly
    toc-title: "Sumário"
    toc-expand: false # Manter sumário, mas escondido por padrão
    page-layout: full # Expande a tela para gráficos
    code-fold: true
    cold-tools: true
    toc: false
    toc-location: body
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    number-sections: true
    fig-pos: "H"
    indent: true
    header-includes: |
      \usepackage{indentfirst}
      \usepackage{latexsym,amssymb,amsmath,amsfonts}
    papersize: a4
    fontsize: 12pt
    geometry: [left=2.5cm, top=2.5cm, right=2.5cm, bottom=2.5cm]
knitr:
  opts_chunk:
    code-before: |
      - source("_common.R")
      

editor: visual
lang: pt

